<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyAB Translation Inspector</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main>
        <h1>MyAB Translation Inspector</h1>
        <label class="switch">
            <input type="checkbox" id="toggle" role="switch">
            <span class="track" aria-hidden="true"></span>
            <span id="toggleLabel"></span>
        </label>
        <p id="hint" class="muted"></p>
        <p id="status" class="status" role="status"></p>
        <button type="button" id="settings"></button>
    </main>
    <script src="popup.js"></script>
</body>
</html>
