<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>myABI Translate · Maintenance</title>
    <style>
        body {
            margin: 0;
            background: #ebeff3;
            color: #172d42;
            font: 1rem/1.5 Arial, "Helvetica Neue", sans-serif;
        }

        main {
            max-width: 36rem;
            margin: clamp(1rem, 8vh, 5rem) auto;
            width: calc(100% - 2rem);
            box-sizing: border-box;
            border: 1px solid #cfd8e2;
            background: #fff;
        }

        h1 {
            margin: 0;
            padding: 0.75rem 1.25rem;
            background: #102348;
            color: #ecf6ff;
            font-size: 1.25rem;
        }

        section {
            padding: 1rem 1.25rem;
            border-top: 1px solid #cfd8e2;
        }

        h2 {
            margin: 0 0 0.25rem;
            font-size: 1.125rem;
        }

        p { margin: 0; }
    </style>
</head>
<body>
    <main>
        <h1>myABI Translate</h1>
        <section lang="fr">
            <h2>Service temporairement indisponible</h2>
            <p>Veuillez réessayer dans quelques instants.</p>
        </section>
        <section lang="de">
            <h2>Dienst vorübergehend nicht verfügbar</h2>
            <p>Bitte versuchen Sie es in Kürze erneut.</p>
        </section>
        <section lang="it">
            <h2>Servizio temporaneamente non disponibile</h2>
            <p>Riprovi tra qualche istante.</p>
        </section>
    </main>
</body>
</html>
