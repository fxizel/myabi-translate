# Alternative only if the existing ingress is Nginx installed on the host.
# Add one vhost; do not replace nginx.conf or another site's configuration.
server {
    listen 80;
    server_name myabi.example.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name myabi.example.org;
    ssl_certificate /etc/letsencrypt/live/myabi.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myabi.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 110m;
    client_body_timeout 1800s;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
    }
}
