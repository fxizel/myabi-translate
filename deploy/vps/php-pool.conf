; Install as /etc/myabi/php-pool.conf, root-owned, mode 0644.
[myabi]
user = myabi-web
group = myabi-web

listen = /run/myabi-php/php-fpm.sock
listen.owner = myabi-web
; Adapt only if the actual Nginx worker uses a different group.
listen.group = www-data
listen.mode = 0660

; Conservative starting point, NOT a RAM/performance qualification.
; Each child can use 256 MiB, in addition to MariaDB, CLI and the host services.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 500

chdir = /srv/myabi
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
request_terminate_timeout = 120s

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 110M
php_admin_value[max_input_time] = 1800
php_admin_value[max_execution_time] = 120
php_admin_value[upload_tmp_dir] = /srv/myabi/shared/storage/framework/uploads
php_admin_value[error_log] = /srv/myabi/shared/storage/logs/php-errors.log
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[opcache.validate_timestamps] = on
php_admin_value[opcache.revalidate_freq] = 0
