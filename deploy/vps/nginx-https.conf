# Final site: install in Nginx's http context AFTER the certificate exists.
# These are site blocks, not a replacement for /etc/nginx/nginx.conf.
# Add IPv6 listeners only after configuring IPv6 and checking the DNS AAAA record.
server {
    listen 80;
    server_name myabi.example.org;
    server_tokens off;
    access_log off;
    error_log /var/log/myabi-nginx/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://myabi.example.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name myabi.example.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/myabi.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myabi.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:myabi_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/myabi/current/public;
    index index.php;
    charset utf-8;
    access_log off;
    error_log /var/log/myabi-nginx/error.log warn;

    # Incident code is ~69 MiB; allow PHP's 100 MiB file / 110 MiB POST limits.
    client_max_body_size 110m;
    client_body_timeout 1800s;
    # Nginx buffers the upload before handing it to PHP. This directory must be
    # private, owned by the Nginx worker, and counted in the disk capacity plan.
    client_body_temp_path /var/lib/myabi-nginx/body 1 2;
    fastcgi_temp_path /var/lib/myabi-nginx/fastcgi 1 2;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Execute only Laravel's front controller, including after internal redirect.
    location = /index.php {
        include fastcgi_params;
        # Resolve the release symlink so OPcache sees a distinct path per release.
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/myabi-php/php-fpm.sock;
        fastcgi_request_buffering on;
        fastcgi_read_timeout 130s;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # Never create a public/storage link: downloads require application ACLs.
    location ~ ^/(?:storage|vendor|\.env)(?:/|$) {
        return 404;
    }
}
