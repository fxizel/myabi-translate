# Bootstrap ONLY: install as this site's configuration in Nginx's http context.
# Replace it with nginx-https.conf after obtaining the real certificate.
# Keep other sites and the host's default server unchanged.
server {
    listen 80;
    server_name myabi.example.org;
    server_tokens off;

    # Query strings can contain business text. No HTTP access log for this site.
    access_log off;
    error_log /var/log/myabi-nginx/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # No login or application data is served before HTTPS is ready.
    location / {
        default_type text/plain;
        return 503 "myABI: preparation du service HTTPS.\n";
    }
}
